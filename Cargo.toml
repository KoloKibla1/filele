[package]
name = "filele"
version = "0.1.0"
edition = "2021"
description = "Fastest LAN file transfer for Windows - parallel streams, pipelined small files, sharded large files"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
console = "0.15"
socket2 = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lz4_flex = "0.11"
walkdir = "2"
local-ip-address = "0.6"
rand = "0.8"
bytes = "1"
futures = "0.3"
num_cpus = "1.16"
hostname = "0.3"
eframe = { version = "0.32", default-features = true }
egui = "0.32"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
